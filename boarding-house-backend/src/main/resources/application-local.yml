
spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            checkserveridentity: true
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

app:
  payments:
    # Simulation: local/demo only
    simulation-enabled: ${PAYMENT_SIMULATION_ENABLED:false}

    # VietQR
    vietqr-template: ${VIETQR_TEMPLATE:compact2}

    # Gateway metadata is owner-scoped in the Integration Center, not in this YAML.
    # Secrets: INTEGRATION_<ownerId>_PAYMENT_VNPAY_HASH_KEY,
    # INTEGRATION_<ownerId>_PAYMENT_MOMO_ACCESS_KEY / MOMO_SECRET_KEY.
    # Sandbox/production endpoints and the 15-minute expiry are defined by GatewayPayments.

  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME}}
    from-name: ${MAIL_FROM_NAME:SmartHome AI}
    business-delivery-enabled: ${MAIL_BUSINESS_DELIVERY_ENABLED:false}
