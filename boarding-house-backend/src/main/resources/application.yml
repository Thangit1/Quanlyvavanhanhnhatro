spring:
  application:
    name: boarding-house-backend
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  profiles:
    default: dev
    group:
      local: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 55MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    user: ${FLYWAY_USERNAME:${spring.datasource.username}}
    password: ${FLYWAY_PASSWORD:${spring.datasource.password}}
    locations: classpath:db/migration
    validate-migration-naming: true

server:
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    org.springframework.jdbc.core: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.http: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  frontend-url: ${FRONTEND_PUBLIC_URL:http://localhost:3000}
  media:
    property-root: ${PROPERTY_IMAGE_ROOT:${user.home}/.smarthome/property-images}
  onboarding:
    max-keys-cards: ${HANDOVER_MAX_KEYS_CARDS:20}
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
    cookie:
      name: refresh_token
      secure: ${COOKIE_SECURE:false}
      same-site: ${COOKIE_SAME_SITE:Lax}
      path: /api/auth
    login:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      lock-duration: ${LOGIN_LOCK_DURATION:900000}
      rate-limit-max: ${LOGIN_RATE_LIMIT_MAX:20}
      rate-limit-window: ${LOGIN_RATE_LIMIT_WINDOW:60000}
    recovery:
      enabled: ${PASSWORD_RECOVERY_ENABLED:false}
      email-limit: ${PASSWORD_RECOVERY_EMAIL_LIMIT:3}
      ip-limit: ${PASSWORD_RECOVERY_IP_LIMIT:20}
    trusted-cloudflare-proxies: ${TRUSTED_CLOUDFLARE_PROXIES:}
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:3000}
  ai:
    provider: ${AI_PROVIDER:none}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
