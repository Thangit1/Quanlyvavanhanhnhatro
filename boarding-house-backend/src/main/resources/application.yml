spring:
  application:
    name: boarding-house-backend
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

server:
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt:
      secret: ${JWT_SECRET:change_me_for_local_development_only_32_bytes}
      access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
    cookie:
      name: refresh_token
      secure: ${COOKIE_SECURE:false}
      same-site: ${COOKIE_SAME_SITE:Lax}
      path: /api/auth
    login:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      lock-duration: ${LOGIN_LOCK_DURATION:900000}
      rate-limit-max: ${LOGIN_RATE_LIMIT_MAX:20}
      rate-limit-window: ${LOGIN_RATE_LIMIT_WINDOW:60000}
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:3000}
  ai:
    provider: ${AI_PROVIDER:none}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
