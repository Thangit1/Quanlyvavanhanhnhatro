spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    # SPRING_MAIL_HOST enables the SMTP sender used by contract onboarding.
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            checkserveridentity: true
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

app:
  payments:
    # The Java profile guard also blocks simulation if an environment override sets true.
    simulation-enabled: false
    vietqr-template: ${VIETQR_TEMPLATE:}
  mail:
    from: ${MAIL_FROM:${spring.mail.username:}}
    from-name: ${MAIL_FROM_NAME:SmartHome AI}
    business-delivery-enabled: ${MAIL_BUSINESS_DELIVERY_ENABLED:false}
  security:
    jwt:
      secret: ${JWT_SECRET}
    cookie:
      secure: true

logging:
  level:
    root: INFO
    com.thangit.boardinghouse: INFO
