name: smarthome-deploy

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --log-bin-trust-function-creators=ON
      - --mysqlx=OFF
    environment:
      MYSQL_DATABASE: boarding_house_management
      MYSQL_ROOT_HOST: localhost
      MYSQL_ROOT_PASSWORD: ${DEPLOY_MYSQL_ROOT_PASSWORD:?Set DEPLOY_MYSQL_ROOT_PASSWORD}
      MYSQL_USER: smarthome_migrator
      MYSQL_PASSWORD: ${DEPLOY_FLYWAY_PASSWORD:?Set DEPLOY_FLYWAY_PASSWORD}
      SMARTHOME_DB_PASSWORD: ${DEPLOY_DB_PASSWORD:?Set DEPLOY_DB_PASSWORD}
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/init-runtime-user.sh:/docker-entrypoint-initdb.d/10-runtime-user.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$SMARTHOME_DB_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u smarthome_app -D boarding_house_management -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 24

  backend:
    build: ./boarding-house-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - path: ${BACKEND_INTEGRATIONS_ENV_FILE:-./deploy/.env}
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_FORWARD_HEADERS_STRATEGY: native
      DB_URL: jdbc:mysql://mysql:3306/boarding_house_management?characterEncoding=utf8&serverTimezone=UTC
      DB_USERNAME: smarthome_app
      DB_PASSWORD: ${DEPLOY_DB_PASSWORD:?Set DEPLOY_DB_PASSWORD}
      FLYWAY_USERNAME: smarthome_migrator
      FLYWAY_PASSWORD: ${DEPLOY_FLYWAY_PASSWORD:?Set DEPLOY_FLYWAY_PASSWORD}
      JWT_SECRET: ${DEPLOY_JWT_SECRET:?Set DEPLOY_JWT_SECRET}
      FRONTEND_URL: https://${DEPLOY_DOMAIN:?Set DEPLOY_DOMAIN}
      FRONTEND_PUBLIC_URL: https://${DEPLOY_DOMAIN:?Set DEPLOY_DOMAIN}
      PROPERTY_IMAGE_ROOT: /var/lib/smarthome/property-images
    volumes:
      - property-images:/var/lib/smarthome/property-images
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/api/v1/health']
      interval: 5s
      timeout: 5s
      start_period: 45s
      retries: 24

  frontend:
    build:
      context: ./boarding-house-frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:3000/login']
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 12

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      DEPLOY_DOMAIN: ${DEPLOY_DOMAIN:?Set DEPLOY_DOMAIN}
    ports:
      - '${DEPLOY_BIND_ADDRESS:-127.0.0.1}:80:80'
      - '${DEPLOY_BIND_ADDRESS:-127.0.0.1}:443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mysql-data:
  property-images:
  caddy-data:
  caddy-config:
