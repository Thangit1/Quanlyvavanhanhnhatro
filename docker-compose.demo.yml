name: smarthome-demo14
services:
  mysql-demo:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DEMO_MYSQL_PASSWORD:?Set a dedicated local test password}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "127.0.0.1:${DEMO_MYSQL_PORT:-3317}:3306"
    volumes:
      - mysql-demo14:/var/lib/mysql
    command: ["--mysqlx=0"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  mysql-demo14:
